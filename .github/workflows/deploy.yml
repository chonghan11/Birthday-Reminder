# CI/CD for Birthday Buddy.
#
#   every push and pull request  ->  "check": make sure the code compiles and the stack builds (no AWS access)
#   push to main (after check)   ->  "deploy": log in to AWS without stored keys, then run cdk deploy
#
# Before the deploy job can work you need, in the AWS project account:
#   1. an IAM OIDC identity provider for GitHub (token.actions.githubusercontent.com)
#   2. an IAM role GitHub may assume (trust limited to this repo's main branch)
# and in GitHub (Settings -> Secrets and variables -> Actions -> Variables):
#   AWS_ROLE_ARN = the ARN of that role
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the workflow itself: reads the code, and (for deploy) ask GitHub for an identity token.
permissions:
  contents: read

jobs:
  check:
    name: Check the code and build the stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk

      # Compiles the TypeScript and builds the CloudFormation template.
      - name: Build the stack (cdk synth)
        run: npx cdk synth --quiet
        working-directory: cdk

  deploy:
    name: Deploy to AWS
    needs: check
    # Only real pushes to main deploy. Pull requests stop after "check".
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # l                                             
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk

      # No access keys are stored anywhere. AWS checks the GitHub token and hands back temporary credentials
      # only if the token comes from this repo's main branch (set in the role's trust policy).
      - name: Log in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      # Shows in the log exactly what is about to change.
      - name: Preview the changes (cdk diff)
        run: npx cdk diff CdkStack
        working-directory: cdk

      # Nobody can answer the approval prompt in CI, so it is switched off. That is acceptable here because only
      # main deploys, and the role can do nothing but run CDK in this one account.
      - name: Deploy (cdk deploy)
        run: npx cdk deploy CdkStack --require-approval never
        working-directory: cdk
